name: Daily Briefing Push

on:
  schedule:
    # 台灣時間每日早上 09:00 (相當於 UTC 時間 01:00)
    - cron: '0 1 * * *'
  workflow_dispatch: # 允許手動點擊按鈕測試觸發

jobs:
  run-daily-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 feedparser yfinance

    - name: Run daily briefing script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python daily_briefing_robot.py
